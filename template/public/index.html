<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon-192x192.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4183F0" />
  <meta name="description" content="Powered By KneUnion Fastify App" />
  <meta name="application-name" content="<%= name.charAt(0).toUpperCase() + name.slice(1) %>" />
  <meta name="apple-mobile-web-app-title" content="<%= name.charAt(0).toUpperCase() + name.slice(1) %>" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title><%= name.charAt(0).toUpperCase() + name.slice(1) %></title>
  <style>
    #app-boot {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #f6f7f9;
    }

    #app-boot-mark {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 22%;
      overflow: hidden;
      background: #eef6ff;
    }

    #app-boot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 斜向光带扫过；用 transform 兼容不支持独立 translate 属性的旧内核 */
    #app-boot-mark::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, rgba(255, 255, 255, 0) 35%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 65%);
      transform: translateX(-100%);
      pointer-events: none;
      animation: app-boot-shine 2.4s ease-in-out 0.3s infinite;
    }

    @keyframes app-boot-shine {
      0% {
        transform: translateX(-100%);
      }

      50%,
      100% {
        transform: translateX(100%);
      }
    }

    #app-boot-name {
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.88);
    }
  </style>
</head>

<body>
  <div id="app-boot">
    <div id="app-boot-mark">
      <img id="app-boot-logo" alt="" src="%PUBLIC_URL%/favicon-192x192.png" />
    </div>
    <div id="app-boot-name"></div>
  </div>
  <script>
    (function () {
      // 应用中心按路径挂载（/app/{name}）时网关不改写这些地址；CDN 部署时 runtimePublicUrl 为完整 URL，保持同源地址不动
      var base = String(window.runtimePublicUrl || '').replace(/\/+$/, '');
      if (base.charAt(0) === '/') {
        var prefix = function (el, attr) {
          var value = el.getAttribute(attr) || '';
          if (value.charAt(0) === '/' && value.indexOf(base + '/') !== 0) {
            el.setAttribute(attr, base + value);
          }
        };
        [].forEach.call(document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"],link[rel="manifest"]'), function (el) {
          prefix(el, 'href');
        });
        var img = document.getElementById('app-boot-logo');
        img && prefix(img, 'src');
      }
      var name = document.getElementById('app-boot-name');
      if (name) {
        name.textContent = document.title;
      }
    })();
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
<script id="kne-pwa-document-embed">(function(w){if(!w||!w.parent||w.parent===w||w.__kneEmbedBridgeInstalled)return;w.__kneEmbedBridgeInstalled=true;var SRC="kne-pwa-document",HOST="kne-app-center-home";var report=function(){try{w.parent.postMessage({source:SRC,type:"location",href:String(w.location.href),pathname:String(w.location.pathname||""),search:String(w.location.search||""),hash:String(w.location.hash||"")},"*");}catch(e){}};var wrap=function(m){var o=w.history[m];if(!o)return;w.history[m]=function(){var r=o.apply(this,arguments);report();return r;};};wrap("pushState");wrap("replaceState");w.addEventListener("popstate",report);w.addEventListener("message",function(ev){var d=ev&&ev.data;if(!d||d.source!==HOST||d.type!=="history")return;try{if(d.action==="back")w.history.back();else if(d.action==="forward")w.history.forward();else if(d.action==="reload")w.location.reload();}catch(e){}});report();})(window);</script></body>
</html>
